[package]
name = "rust-tweaker"
version = "1.0.0"
description = "Windows optimization tweaker with a 3D animated UI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
